name: Check and deploy GitHub Pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Check pull requests; publish only the repository's default branch.
    if: github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.20.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck, lint, unit tests and build
        run: npm run check
      - name: Test comparison service boundaries without model downloads
        run: |
          python3 -m venv "$RUNNER_TEMP/comparison-tests"
          "$RUNNER_TEMP/comparison-tests/bin/python" -m pip install -r service/requirements-test.txt
          "$RUNNER_TEMP/comparison-tests/bin/python" -m unittest service.test_service
      - name: Install test browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Check comparison capture startup repeatedly
        run: npm run test:e2e -- tests/comparison.spec.ts --project=chromium --grep "flushes real" --repeat-each=3 --workers=1
      - name: Test production app at root and project paths
        # Real-time audio must not compete with another test's accelerated ML
        # inference/model preparation on the shared runner. Keep every test.
        run: npm run test:e2e -- --workers=1 --max-failures=1
      - name: Upload static site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
